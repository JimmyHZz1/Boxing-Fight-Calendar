name: Build Windows desktop app

on:
  pull_request:
    paths:
      - "WindowsApp/**"
      - ".github/workflows/build-windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Create branded application icon
        shell: pwsh
        run: .\WindowsApp\Create-AppIcon.ps1
      - name: Publish self-contained Windows x64 executable
        run: >-
          dotnet publish .\WindowsApp\SportsGamesCalendar.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o .\publish
      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = ".\publish\TheHub.exe"
          if (!(Test-Path $exe)) { throw "Published executable was not found: $exe" }
          Get-Item $exe | Select-Object Name, Length
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TheHub-Windows-x64
          path: .\publish\TheHub.exe
          if-no-files-found: error
          retention-days: 30
