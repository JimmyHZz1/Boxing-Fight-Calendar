name: Sync major game company profiles
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 2"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import IGDB catalogue
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: node .github/scripts/sync-company-profiles.mjs
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/company-profiles.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/company-profiles.json
          git commit -m "Refresh major game company profiles"
          git push
