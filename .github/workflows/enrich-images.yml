name: Gradual image enrichment

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_sports.py"
      - ".github/workflows/enrich-images.yml"
      - "data/sports-hub.json"
      - "data/darts.json"
      - "data/fights.json"
      - "data/ufc.json"
      - "data/bkfc.json"
      - "data/sports-images.json"
      - "data/fighter-images.json"
      - "data/event-fighter-images.json"
      - "assets/images/**"
  schedule:
    # Recovery check in case a run is interrupted or Commons rate-limits us.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      batches:
        description: "How many five-image batches to process"
        required: true
        default: "6"
        type: choice
        options: ["1", "3", "6", "10"]

permissions:
  contents: write

concurrency:
  group: sports-data-refresh
  cancel-in-progress: false

jobs:
  enrich-images:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Process bounded five-image batches per run
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          run_batch() {
            local output
            output="$(python scripts/sync_sports.py --images-only 2>&1)" || {
              echo "$output"
              return 1
            }
            echo "$output"
            local summary
            summary="$(printf '%s\n' "$output" | grep 'IMAGE_ENRICHMENT:' | tail -n 1 | sed 's/^.*IMAGE_ENRICHMENT: //')"
            if [ -z "$summary" ]; then
              echo "Image enrichment did not return its diagnostics summary."
              return 1
            fi
            BATCH_ATTEMPTED="$(python -c 'import json,sys; print(int(json.loads(sys.argv[1]).get("attempted",0)))' "$summary")"
            BATCH_RATE_LIMITED="$(python -c 'import json,sys; print("true" if json.loads(sys.argv[1]).get("rate_limited") else "false")' "$summary")"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then\n            MAX_BATCHES="${{ inputs.batches }}"\n          else\n            MAX_BATCHES=1\n          fi
          for batch in $(seq 1 "$MAX_BATCHES"); do
            echo "::group::Image enrichment batch $batch"
            run_batch

            if [ "$BATCH_ATTEMPTED" -eq 0 ]; then
              echo "No eligible image lookups remain. Queue drained."
              # Discard timestamp-only changes from the final empty check.
              git reset --hard HEAD
              echo "::endgroup::"
              exit 0
            fi

            published=false
            for attempt in 1 2 3; do
              git add data/ assets/images/
              if git diff --cached --quiet; then
                echo "No files changed in this batch."
                published=true
                break
              fi
              git commit -m "Enrich sports image library batch $batch"
              if git push origin HEAD:main; then
                published=true
                break
              fi

              echo "main moved during batch publication; refreshing and retrying (attempt $attempt)."
              git fetch origin main
              git reset --hard origin/main
              run_batch
              if [ "$BATCH_ATTEMPTED" -eq 0 ]; then
                echo "Queue was completed by another run."
                published=true
                break
              fi
            done

            if [ "$published" != true ]; then
              echo "Could not publish image batch after three attempts."
              exit 1
            fi

            echo "Published batch $batch ($BATCH_ATTEMPTED lookups attempted)."
            echo "::endgroup::"

            if [ "$BATCH_RATE_LIMITED" = "true" ]; then
              echo "Wikimedia Commons rate limit detected; pausing until the scheduled recovery run."
              exit 0
            fi
            if [ "$BATCH_ATTEMPTED" -lt 5 ]; then
              echo "Fewer than five eligible lookups were available; queue is drained."
              exit 0
            fi
          done

          echo "Completed $MAX_BATCHES image batch(es); the next scheduled run will continue the remaining queue."
