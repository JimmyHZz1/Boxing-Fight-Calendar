name: Gradual image enrichment

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_sports.py"
      - ".github/workflows/enrich-images.yml"
      - "data/image-library.json"
  schedule:
    - cron: "47 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-data-refresh
  cancel-in-progress: false

jobs:
  enrich-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enrich five images from the saved queue
        run: python scripts/sync_sports.py --images-only
      - name: Commit image progress and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ assets/images/
          if git diff --cached --quiet; then
            echo "No image-library changes."
            exit 0
          fi
          git commit -m "Enrich sports image library in small batches"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
