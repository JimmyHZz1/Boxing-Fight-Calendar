name: Refresh boxing schedule

on:
  schedule:
    # Every two hours; Boxerbook's free key allows 100 requests per day.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boxing-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch event cards and upcoming bouts
        env:
          BOXERBOOK_API_KEY: ${{ secrets.BOXERBOOK_API_KEY }}
          BOXING_API_KEY: ${{ secrets.BOXING_API_KEY }}
        run: python scripts/sync_fights.py

      - name: Commit and publish updated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/fights.json; then
            echo "No schedule changes."
            exit 0
          fi

          # Commit the generated file BEFORE rebasing. Pulling first fails
          # because the sync script has already modified data/fights.json.
          git add data/fights.json
          git commit -m "Refresh boxing schedule"

          # Rebase our generated snapshot onto any changes made to main
          # since checkout, then publish it.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
