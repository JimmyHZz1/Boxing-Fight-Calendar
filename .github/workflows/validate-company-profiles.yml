name: Validate company profile code
on:
  pull_request:
    paths:
      - 'games-discovery.js'
      - 'games-calendar.js'
      - '.github/scripts/sync-company-profiles.mjs'
      - '.github/workflows/sync-company-profiles.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check games-discovery.js
      - run: node --check games-calendar.js
      - run: node --check .github/scripts/sync-company-profiles.mjs
